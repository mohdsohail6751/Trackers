<style>
/* Layout: a single study column — sticky progress header, phase bands, collapsible week cards with checklists */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#151f27; --surface-2:#1b2731; --line:#2a3946;
  --fg:#e3ebf1; --muted:#93a4b2; --accent:#4cb8d6; --accent-soft:#163846;

:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#151f27; --surface-2:#1b2731; --line:#2a3946;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:14px 12px;display:grid;gap:10px}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:1.35rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.stat{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--fg);font-weight:500}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.chip{font:500 .8rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 10px;border-radius:999px;cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
button.chip:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save{margin-left:auto;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.save .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.save[data-s="cloud"] .dot{background:var(--done)}
.save[data-s="local"] .dot{background:var(--warn)}
.save[data-s="saving"] .dot{background:var(--accent)}

.intro{color:var(--muted);margin:22px 0 6px;max-width:65ch}
.phase{margin-top:28px}
.phase-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:6px;margin-bottom:12px}
.phase-head h2{font-family:var(--f-display);font-size:1.05rem;margin:0;text-transform:uppercase;letter-spacing:.06em}
.phase-head .stat{font-size:.8rem}
.weeks{display:grid;gap:10px}
details.week{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.week[data-done="true"]{border-color:var(--done)}
details.week[data-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
.wk{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);min-width:3.2em}
.wtitle{min-width:0}
.wtitle strong{display:block;font-weight:600;font-size:.98rem}
.wtitle span{display:block;font-size:.8rem;color:var(--muted)}
.ring{font-family:var(--f-mono);font-size:.78rem;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
details.week[data-done="true"] .ring{background:var(--done-soft);color:var(--done)}
details.week[data-current="true"] .ring{background:var(--accent-soft);color:var(--fg)}
.now{font:600 .68rem var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-left:6px}
ul.tasks{list-style:none;margin:0;padding:0 14px 12px;display:grid;gap:2px}
ul.tasks li{min-width:0}
ul.tasks label{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;padding:7px 6px;border-radius:6px;cursor:pointer}
ul.tasks label:hover{background:var(--surface-2)}
ul.tasks input{width:17px;height:17px;margin:2px 0 0;accent-color:var(--done)}
ul.tasks input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.tag{font:500 .66rem var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-right:6px}
.tag.p{color:var(--done)}
code{font-family:var(--f-mono);font-size:.84em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.empty-note{color:var(--muted);font-size:.85rem;padding:0 14px 12px}
footer{margin-top:36px;color:var(--muted);font-size:.82rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.confirm{display:inline-flex;gap:8px;align-items:center}
@media (max-width:480px){summary{grid-template-columns:1fr auto}.wk{grid-column:1/-1}h1{font-size:1.2rem}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>

const $ = id => document.getElementById(id);

function el(tag, attrs, kids){
  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){ if(k==="text") n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); }
  (kids||[]).forEach(c => c && n.appendChild(c));
  return n;
}

      el("div",{class:"weeks"})
    ]);
    const list = sec.querySelector(".weeks");
    weeks.forEach(w => {
      const d = el("details",{class:"week",id:"week-"+w[0],"data-week":w[0]});
      const sum = el("summary",null,[
        el("span",{class:"wk",text:"W"+String(w[0]).padStart(2,"0")}),
        el("div",{class:"wtitle"},[ el("strong",{text:w[1]}), el("span",{text:w[2]}) ]),
        el("span",{class:"ring"})
      ]);
      d.appendChild(sum);
      const ul = el("ul",{class:"tasks"});
      w[4].forEach((t,i) => {
        const id = "w"+w[0]+"-"+i;
        const isP = t.startsWith("P:");
        const cb = el("input",{type:"checkbox",id:"cb-"+id,"data-id":id});
        const span = el("span",null,[ el("span",{class:"tag"+(isP?" p":""),text:isP?"Practice":"Topic"}), document.createTextNode(t.slice(2)) ]);
        const li = el("li",{"data-id":id},[ el("label",{for:"cb-"+id},[cb,span]) ]);
        ul.appendChild(li);
      });
      d.appendChild(ul);
      d.appendChild(el("p",{class:"empty-note",hidden:"",text:"Is week ka sab done ✓"}));
      list.appendChild(d);
    });
    phasesEl.appendChild(sec);
  });
}

let firstRender = true;
function render(){
  const total = ALL.length;
  const n = ALL.filter(id => done[id]).length;
  $("overallStat").innerHTML = "";
  const b = document.createElement("b"); b.textContent = n;
  $("overallStat").append(b, document.createTextNode(" / "+total+" done · "+Math.round(n*100/total)+"%"));
  $("overallBar").style.width = (n*100/total)+"%";

  let currentWeek = null;
  W.forEach(w => {
    const ids = w[4].map((t,i) => "w"+w[0]+"-"+i);
    const c = ids.filter(id => done[id]).length;
    const d = $("week-"+w[0]);
    const complete = c === ids.length;
    if(!complete && currentWeek === null) currentWeek = w[0];
    d.dataset.done = complete;
    d.querySelector(".ring").textContent = c+"/"+ids.length;
    ids.forEach(id => {
      const cb = $("cb-"+id);
      cb.checked = !!done[id];
      cb.closest("li").hidden = showPending && !!done[id];
    });
    d.querySelector(".empty-note").hidden = !(showPending && complete);
  });
  document.querySelectorAll("details.week").forEach(d => {
    const isCur = Number(d.dataset.week) === currentWeek;
    d.dataset.current = isCur;
    const s = d.querySelector(".wtitle strong");
    const old = s.querySelector(".now"); if(old) old.remove();
    if(isCur){ s.appendChild(el("span",{class:"now",text:"Abhi yahan"})); }
  });
  if(firstRender && currentWeek !== null){ $("week-"+currentWeek).open = true; firstRender = false; }

  PHASES.forEach(([key]) => {
    const ids = W.filter(w=>w[3]===key).flatMap(w => w[4].map((t,i)=>"w"+w[0]+"-"+i));
    const c = ids.filter(id=>done[id]).length;
    document.querySelector('[data-phase-stat="'+key+'"]').textContent = c+"/"+ids.length;
  });
}

// ---- persistence ----
let docRef = null, mode = "local", dirty = false, writing = false, timer = null;
function setSave(s, text){ $("saveState").dataset.s = s; $("saveText").textContent = text; }

function scheduleSave(){
  lsWrite();
  if(!docRef){ setSave("local","Sirf is browser mein saved"); return; }
  dirty = true;
  setSave("saving","Saving…");
  clearTimeout(timer);
  timer = setTimeout(flush, 600);
}
async function flush(){
  if(!docRef || writing || !dirty) return;
  writing = true; dirty = false;
  try{
    await docRef.set({ done: Object.assign({}, done), updatedAt: new Date().toISOString() });
    setSave("cloud","Aapke account mein saved");
  }catch(e){
    if(e && e.code === "unavailable"){ dirty = true; setTimeout(flush, 1500 + Math.random()*1000); }
    else { docRef = null; setSave("local","Sirf is browser mein saved"); }
  }finally{
    writing = false;
    if(dirty) flush();
  }
}

phasesEl.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.id;
  if(!id) return;
  if(e.target.checked) done[id] = true; else delete done[id];
  render();
  scheduleSave();
});

$("btnPending").addEventListener("click", e => {
  showPending = !showPending;
  e.currentTarget.setAttribute("aria-pressed", showPending);
  render();
});
$("btnExpand").addEventListener("click", () => document.querySelectorAll("details.week").forEach(d => d.open = true));
$("btnCollapse").addEventListener("click", () => document.querySelectorAll("details.week").forEach(d => d.open = false));

const resetBox = $("resetBox");
function showResetButton(){
  resetBox.replaceChildren(el("button",{class:"chip",id:"btnReset",text:"Progress reset karo"}));
  $("btnReset").addEventListener("click", askReset);
}
function askReset(){
  const yes = el("button",{class:"chip",text:"Haan, sab clear karo"});
  const no = el("button",{class:"chip",text:"Cancel"});
  yes.addEventListener("click", () => { done = {}; render(); scheduleSave(); showResetButton(); });
  no.addEventListener("click", showResetButton);
  resetBox.replaceChildren(el("span",{text:"Pakka?"}), yes, no);
}
$("btnReset").addEventListener("click", askReset);

// boot
build();
done = lsRead() || {};
render();
setSave("init","Connecting…");

(async () => {
  try{
    if(!window.claude || !window.claude.use){ setSave("local","Sirf is browser mein saved"); return; }
    const [db, user] = await Promise.all([ claude.use("db"), claude.use("user") ]);
    const uid = user ? await user.id() : null;
    if(!db || !uid){ setSave("local","Sirf is browser mein saved (sign in karke account mein save hoga)"); return; }
    docRef = db.doc("data/users/" + uid + "/progress");
    let gotServer = false;
    const t = setTimeout(() => { if(!gotServer) setSave("local","Account se connect nahi ho pa raha, browser mein save ho raha hai"); }, 10000);
    docRef.onSnapshot(snap => {
      if(!snap.metadata.fromCache){ gotServer = true; clearTimeout(t); }
      if(snap.metadata.hasPendingWrites || dirty || writing) return;
      if(snap.exists){
        const d = snap.data();
        done = Object.assign({}, (d && d.done) || {});
        lsWrite(); render();
        setSave("cloud","Aapke account mein saved");
      } else if(gotServer){
        // first time: move any browser-only progress into the account
        if(Object.keys(done).length){ dirty = true; flush(); }
        else setSave("cloud","Aapke account mein saved");
      }
    }, err => {
      clearTimeout(t); docRef = null;
      setSave("local","Sirf is browser mein saved");
    });
  }catch(e){ setSave("local","Sirf is browser mein saved"); }
})();
})();
</script>
